version: 2

sources:
  - name: finance
    description: "Dados brutos do sistema financeiro da empresa."
    schema: data_set_financial
    loader: bigquery
    # loader_at_field: data_carga
    meta: 
      owner: "empresa byty"
    freshness: 
      warn_after: {count: 1, period: day}
      error_after: {count: 2, period: day}
  

    tables:
      - name: dados_financeiros
        description: "Tabela com os lancamentos financeiros da empresa."
        columns: 
          - name: nome
            description: "Nome do lancamento financeiro"
          - name: data
            description: "Data do lancamento financeiro"
          - name: valor
            description: "Valor do lancamento financeiro"
          - name: status
            description: "Status do lancamento financeiro"
          - name: banco
            description: "Banco do lancamento financeiro"
          - name: destino 
            description: "Destino do lancamento financeiro"
          - name: responsavel
            description: "Responsavel pelo lancamento financeiro"
          - name: tipo
            description: "Tipo do lancamento financeiro"
          - name: valor_real
            description: "Valor real do lancamento financeiro"
          - name: categoria
            description: "Categoria do lancamento financeiro"
          - name: mes  
            description: "Mes do lancamento financeiro"
          - name: id
            description: "Id do lancamento financeiro"
            
              


    

    
