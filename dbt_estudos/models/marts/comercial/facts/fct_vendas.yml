version: 2

models:
    - name: fct_vendas
      description: "Tabela com os fatos de vendas."
      tests:
        - not_null
        - unique
      columns: 
        - name: mes
          tests:
            - not_null
            - accepted_values:
                values:
                  - jan
                  - fev
                  - mar
                  - abr
                  - mai
                  - jun
                  - jul
                  - ago
                  - set
                  - out
                  - nov
                  - dez  
          description: "Mês da venda"
        - name: ano  
          description: "Ano da venda"
        - name: total_frete
          tests:
            - not_null
          description: "Total de frete da venda"